<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Test</title>
</head>

<body>
    <input style="width:500px" id="cameraUrl" />
    <button onClick="Play_Live()">Play Live</button>
    <button onClick="Play_Playback()">Play Playback</button>

    <!-- div where video will be played -->
    <div style="height: 500px;width:100%" id="someUniqueId"></div>


    <script src="i2v_player.min.js"></script>
    <script>
        var playerObj;
        var vmsIp = "192.168.1.17";
        var playerIp = "localhost";
        var sdk = new I2vSdk();
        sdk.InitPlayer(vmsIp, "vms", function () {

        }, function (err) {

        }, playerIp);

        function Play_Live() {
            // Check if player is running then stop first
            if (playerObj) {
                playerObj.stop();
            }

            //get url to play
            var url = document.getElementById("cameraUrl").value;
            var isusingTranscoding = "0"; // may be 0
            var ctrlinput = "0";
            var seektime = "0";
            //create new player object, video will start automatically
            playerObj = sdk.GetPlayer("someUniqueId", url, isusingTranscoding, ctrlinput, seektime);

            //set Error callback for play method
            playerObj.setErrorCallback(function (err) {
                console.error(err);
            });

            //set retrying callback
            playerObj.setRetryingCallback(function (err) {
                console.log("disconnected, retrying to connect!!");
            });

            //call play method
            playerObj.play();
        }


        function Play_Playback() {
            if (playerObj) {
                playerObj.stop();
            }

            //get url to play
            var url = document.getElementById("cameraUrl").value;
            var isusingTranscoding = "1";
            var ctrlinput = "1";
            var seektime = "0";

            //create new player object, video will start automatically
            playerObj = sdk.GetPlayer("someUniqueId", url, isusingTranscoding, ctrlinput, seektime);

            //set Error callback for play method
            playerObj.setErrorCallback(function (err) {
                console.error(err);
            });

            //set retrying callback
            playerObj.setRetryingCallback(function (err) {
                console.log("disconnected, retrying to connect!!");
            });

            //call play method
            playerObj.play();
        }
    </script>

</body>

</html>
