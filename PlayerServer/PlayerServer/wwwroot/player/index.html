<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Test</title>
    <script type="text/javascript" src="moment.min.js"></script>
</head>

<body>
    <input style="width:500px" id="cameraId" />

    <button onClick="Play_Live()">Play Live</button>
    <input id="date" type="date">
    <input id="time" type="time" step="1" value="18:00">
    <button onClick="Play_Playback()">Play Playback</button>
    <button onClick="seekVideo()">Seek Video</button>

    <!-- div where video will be played -->
    <div style="height: 500px;width:100%" id="someUniqueId"></div>

    <script src="i2v_player.min.js"></script>
    <script>
        var playerObj;
        var serverIp = "127.0.0.1"; //This is Ip of Player Server Module (Same as VMS if player server installed on same machine)
        var playerIp = "127.0.0.1"; //This is Ip of Player Stramer
        var UseSecureConnection = false;

        var sdk = new I2vSdk(playerIp, serverIp, UseSecureConnection);

        var latestDivId = "someUniqueId"


        document.getElementById("date").defaultValue = moment().format('YYYY-MM-DD');

        function Play_Live() {
            // Check if player is running then stop first
            if (playerObj) {
                playerObj.stop();
            }

            //get url to play
            var cameraId = document.getElementById("cameraId").value;

            var streamType = "0";


            if (streamType == "") {
                streamType = "0";
            }

            var advanceDecoding = "0";

            var connectionmode = "tcp";

            var providedDiv = document.getElementById(latestDivId);
            providedDiv.id = Math.trunc(Math.random() * 1000);
            latestDivId = providedDiv.id;

            //create new player object, video will start automatically
            playerObj = sdk.GetLivePlayer(latestDivId, cameraId, streamType, advanceDecoding);

            //set Error callback for play method
            playerObj.setErrorCallback(function (err) {
                console.error(err);
            });

            //set retrying callback
            playerObj.setRetryingCallback(function (err) {
                console.log("disconnected, retrying to connect!!");
            });

            //call play method
            playerObj.play();
        }

        function seekVideo() {
            if (playerObj) {
                playerObj.SeekVideo("10");
            }

        }
        function Play_Playback() {
            if (playerObj) {
                playerObj.stop();
            }

            //get url to play
            var cameraId = document.getElementById("cameraId").value;

            var date = document.getElementById("date").value;
            var time = document.getElementById("time").value;
            var datetime = moment(date + " " + time);
            var startTime = datetime.unix();

            var _playbackviaapache = "0";


            var providedDiv = document.getElementById(latestDivId);
            providedDiv.id = Math.trunc(Math.random() * 100);
            latestDivId = providedDiv.id;

            //create new player object, video will start automatically
            playerObj = sdk.GetPlaybackPlayer(latestDivId, cameraId, startTime, _playbackviaapache);

            //set Error callback for play method
            playerObj.setErrorCallback(function (err) {
                console.error(err);
            });

            //set retrying callback
            playerObj.setRetryingCallback(function (err) {
                console.log("disconnected, retrying to connect!!");
            });

            //call play method
            playerObj.play();
        }
    </script>

</body>

</html>
