# ============================================================
# coturn configuration
# ============================================================

# ----- Listening ports -----
listening-port=3478
tls-listening-port=5349

# ----- Bind only to the real LAN interface -----
# Without these, coturn auto-discovers and binds EVERY interface,
# including all the docker bridges (172.x) — pure noise in the log
# and spurious relay candidates. Pin to this host's LAN address.
listening-ip=192.168.5.106
relay-ip=192.168.5.106

# ----- Relay port range (must match firewall rules) -----
# 41 ports = 41 concurrent TURN sessions. Grow if needed.
min-port=49160
max-port=49200

# ----- Public IP (REQUIRED) -----
# coturn advertises this address to clients as their relay address.
# Set to the public IP of THIS server.
# If this host is itself behind NAT (rare for a TURN server),
# use the form: external-ip=PUBLIC_IP/PRIVATE_IP
#
# This host IS behind a NAT router (public 203.190.139.10 is
# port-forwarded to LAN 192.168.5.106), so the mapped form is
# required — otherwise coturn hands the remote browser a relay
# candidate of 192.168.5.106, which is unreachable from the internet.
external-ip=203.190.139.10/192.168.5.106

# ----- Authentication -----
# Long-term credentials mechanism (static username/password).
# For production at scale, switch to time-limited HMAC creds
# (use-auth-secret + static-auth-secret) so browsers can't leak
# permanent creds.
lt-cred-mech
realm=streamer
user=streamuser:i2vsys@123

# WebRTC requires ICE fingerprinting
fingerprint

# ----- TLS (uncomment when you have certs) -----
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/pkey.pem
# cipher-list="ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20"

# ----- Hardening -----
# NOTE: no-cli / no-tlsv1 / no-tlsv1_1 were REMOVED — Coturn 4.14 rejects
# them ("Bad configuration format" / "deprecated" warnings in the log).
#   * TLS 1.0/1.1 are already unusable: this build's OpenSSL only
#     negotiates TLS 1.2/1.3, so no-tlsv1* is redundant.
#   * The admin CLI binds to 127.0.0.1 only by default; not exposed.
no-multicast-peers

# Allow relaying to the local streamer peer. It lives on this same
# host (192.168.5.106), which falls inside the denied 192.168/16 range
# below — without this exception every CREATE_PERMISSION for it fails
# with "403 Forbidden IP". allowed-peer-ip overrides the denied ranges
# for this single address.
allowed-peer-ip=192.168.5.106

# Deny relaying to loopback / private / reserved ranges.
# Prevents abusers from using your TURN server to scan internal
# networks or attack localhost services.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

# ----- Logging -----
log-file=stdout
# Drop 'verbose' once things are stable — it's noisy under load.
verbose
