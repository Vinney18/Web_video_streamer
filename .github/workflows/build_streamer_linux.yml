name: Build Streamer Linux

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-20.04

    container:
      image: i2vdocker/vcpkg-linux:1.0
      credentials:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      options: --user=root  # Run as root to avoid permission issues
      volumes:
        - ${{ github.workspace }}:/app/code

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Build Streamer C++ app
      run: |
        cd /app
        cd code/streamer
        ls -a
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=/vcpkg/scripts/buildsystems/vcpkg.cmake
        make -j 4

    - name: Copy to release and add lib
      run: |
        cd /app/code/streamer/build
        mkdir Release
        mkdir Release/lib
        cp streamer ./Release
        cd Release
        ldd ./streamer | grep "=>" | awk '{print $3}' | xargs -I '{}' cp -v '{}' ./lib

    - name: Display build output And add release notes
      run: |
        cd /app/code/streamer/build/Release
        ls
        echo "Release Version:${{ github.event.release.tag_name }}" > release_notes.md
    
    - name: Pack to zip
      run: |
        cd /app/code/streamer/build
        zip -r streamer-${{runner.os}}.zip Release

    # upload release assets
    - name: Upload to release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: /app/code/streamer/build/streamer-${{runner.os}}.zip
        asset_name: streamer-${{runner.os}}.zip
        asset_content_type: application/zip


  build_docker_image:
    runs-on: ubuntu-20.04
    needs: build

    steps:
    - name: make app directory
      run: |
        mkdir app
    # get the release folder from the previous build job
    - name: download release
      uses: actions/download-artifact@v2
      with:
        name: streamer-${{runner.os}}.zip

    - name: Unzip release
      run: |
        cd /app
        unzip streamer-${{runner.os}}.zip

    - name: Build Docker image
      run: |
        cd streamer-${{runner.os}}/build
        docker build -t @{{ secrets.DOCKER_USERNAME }}/streamer:${{ github.event.release.tag_name }} -f streamer_github_action.Dockerfile .

    - name: Log in to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Docker image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/streamer:${{ github.event.release.tag_name }}
