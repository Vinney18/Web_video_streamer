name: Build C++ App Linux

on:
    release:
      types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: i2vdocker/vcpkg-linux:1.0
      credentials:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      options: --user=root  # Run as root to avoid permission issues
      volumes:
        - ${{ github.workspace }}:/app/code

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Build C++ app
      run: |
        cd /app
        cd code/streamer
        ls -a
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=/app/vcpkg/scripts/buildsystems/vcpkg.cmake
        make -j 4

    - name: Display build output And add release notes
      run: |
        cd /app/code/streamer/build
        ls
        echo "Release Version:${{ github.event.release.tag_name }}" > release_notes.md
    
    - name: Pack to zip
      run: |
        cd /app/code/streamer
        zip -r streamer-${{runner.os}}.zip build
      

    # upload release assets
    - name: Upload to release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: /app/code/streamer-${{runner.os}}.zip
        asset_name: streamer-${{runner.os}}.zip
        asset_content_type: application/zip
