name: Build C++ App

on:
    release:
      types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: i2vdocker/ubuntu_cmake_vcpkg:1.0
      credentials:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      options: --user=root  # Run as root to avoid permission issues
      volumes:
        - ${{ github.workspace }}:/app/code

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: List files in docker container
      run: |
        cd /app
        ls -a
        cd vcpkg
        # set path to vcpkg
        ./bootstrap-vcpkg.sh
    
    - name: Build C++ app
      run: |
        cd /app
        cd code/streamer
        ls -a
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=/app/vcpkg/scripts/buildsystems/vcpkg.cmake
        make -j 4

    - name: Display build output
      run: |
        cd /app/code/streamer/build
        ls -la  # List all files and directories
