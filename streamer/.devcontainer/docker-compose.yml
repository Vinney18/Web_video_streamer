version: '3'

services:
  web_player_full_linux20_dev:
    image : yashsisodia/wplayer_dev_20:1
    
    ports:
      - 8181:8181
      # - 8890:8890
    volumes:      
      - ..:/webwork/
      - ~/.gitconfig:/root/.gitconfig
      - /tmp/.X11-unix:/tmp/.X11-unix     
    environment:      
      DISPLAY:
      XAUTHORITY:

    networks:
      - wplayer_network    
    container_name: wplayer_linux20
    command: sleep infinity
    
  
networks:
  wplayer_network:
    driver: bridge